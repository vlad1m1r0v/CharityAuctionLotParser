[tool.poetry]
name = "auction-parser"
version = "0.1.0"
description = "Збір результатів благодійного аукціону з Telegram-каналу та формування Excel-звіту"
authors = ["Auction Parser"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
telethon = "^1.36"
openpyxl = "^3.1"
python-dotenv = "^1.0"
qrcode = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
